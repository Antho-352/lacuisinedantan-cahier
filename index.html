<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>La cuisine d’antan — cahier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Libre+Caslon+Text:ital@0;1&display=swap" rel="stylesheet" />
  <script src="./data.js"></script>
  <style>
    :root {
      --blue: #8aa3bb;
      --blue-2: #7a96b0;
      --spine: #2f2824;
      --cream: #f7f0de;
      --cream-2: #efe6cf;
      --ink: #2c241c;
      --muted: #6a5a48;
      --rule: #cbbfa4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Libre Baskerville", Georgia, serif;
      color: var(--ink);
      background: #cfc6b4;
    }
    .stage {
      height: 100%;
      padding: 8px;
      display: grid;
      place-items: center;
    }
    .book {
      width: calc(100vw - 16px);
      height: calc(100vh - 16px);
      position: relative;
      display: grid;
      grid-template-columns: 42px 1fr;
      background: var(--blue);
      box-shadow: 0 18px 40px rgba(50,40,30,.28);
    }
    .book.closed {
      width: min(720px, calc(100vw - 16px));
      height: calc(100vh - 16px);
      grid-template-columns: 52px 1fr;
    }
    .spine {
      background:
        linear-gradient(90deg, #1c1815, var(--spine) 35%, #4a4038 55%, #2a2420);
      box-shadow: inset -8px 0 12px rgba(0,0,0,.25);
    }
    .cover {
      display: none;
      position: relative;
      background:
        radial-gradient(ellipse 80% 50% at 50% 30%, rgba(255,255,255,.16), transparent 55%),
        var(--blue-2);
      cursor: pointer;
    }
    .book.closed .cover { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .book.closed .spread { display: none; }
    .label {
      width: min(78%, 440px);
      background: #f4ead3;
      border: 2px solid #d7c7a4;
      box-shadow: inset 0 0 0 7px #f4ead3, inset 0 0 0 9px #e4d4b4;
      border-radius: 8px;
      text-align: center;
      padding: 22px 18px 16px;
    }
    .author {
      font-family: "Great Vibes", cursive;
      font-size: 28px;
      color: #5c5348;
      margin-bottom: 6px;
    }
    .label h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(42px, 7vw, 64px);
      line-height: .95;
      font-weight: 400;
      color: #3a332c;
    }
    .label h1 span { display: block; font-size: .72em; }
    .still {
      margin-top: 28px;
      width: min(280px, 70%);
    }
    .open-hint {
      margin-top: 22px;
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #4a4038;
    }
    .spread {
      display: grid;
      grid-template-columns: minmax(260px, 34%) 1fr;
      min-width: 0;
      min-height: 0;
      background: var(--cream);
    }
    .nav, .sheet {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .nav {
      background: linear-gradient(180deg, #fbf6e8, var(--cream-2));
      border-right: 1px solid var(--rule);
      padding: 18px 14px 12px 16px;
    }
    .nav-top { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .nav-top button, .sheet-nav button, .mesh a, .mesh button {
      font-family: inherit;
      font-size: 12px;
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 2px;
    }
    .nav-top button:hover, .sheet-nav button:hover, .mesh a:hover, .mesh button:hover {
      background: #e8dcc0;
    }
    .nav h2 {
      font-family: "Great Vibes", cursive;
      font-size: 34px;
      font-weight: 400;
      margin-bottom: 4px;
    }
    .toc {
      overflow: auto;
      flex: 1;
      padding-right: 6px;
    }
    .chap {
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #7a4a3a;
      margin: 12px 0 4px;
    }
    .toc button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      font: 13px/1.35 "Libre Baskerville", serif;
      color: inherit;
      padding: 5px 8px;
      cursor: pointer;
    }
    .toc button:hover { background: rgba(138,163,187,.2); }
    .toc button.is-on { background: #8aa3bb; color: #f7f0de; }
    .sheet { background: linear-gradient(180deg, #fffaf0, var(--cream)); }
    .sheet-body {
      flex: 1;
      overflow: auto;
      padding: 28px 36px 16px;
    }
    .url { font-size: 12px; color: #7a4a3a; margin-bottom: 8px; word-break: break-all; }
    .url a { color: inherit; }
    .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #7a4a3a; margin-bottom: 4px; }
    .sheet h1 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(36px, 4.4vw, 52px);
      font-weight: 400;
      line-height: 1;
      margin-bottom: 8px;
    }
    .lede { font-style: italic; color: var(--muted); margin-bottom: 14px; }
    .photo {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border: 1px solid #d7c7a4;
      margin: 6px 0 14px;
    }
    article p { font-size: 16px; line-height: 1.65; margin-bottom: 12px; max-width: 68ch; }
    .sheet-foot {
      border-top: 1px solid var(--rule);
      padding: 10px 36px 14px;
      background: #f3ead6;
    }
    .sheet-nav {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .mesh {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      font-size: 12px;
      align-items: center;
    }
    .mesh span { color: var(--muted); margin-right: 4px; }
    .mesh a { text-decoration: none; }
    .corners {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hit-next, .hit-prev {
      position: absolute;
      top: 0; bottom: 70px;
      width: 11%;
      pointer-events: auto;
      cursor: pointer;
    }
    .hit-next { right: 0; }
    .hit-prev { left: 0; }
    @media (max-width: 860px) {
      .spread { grid-template-columns: 1fr; }
      .nav { max-height: 34%; border-right: 0; border-bottom: 1px solid var(--rule); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="book closed" id="book">
      <div class="spine"></div>
      <div class="cover" id="cover">
        <div class="label">
          <p class="author">La cuisine d’antan</p>
          <h1>Cahier<span>de maison</span></h1>
        </div>
        <svg class="still" viewBox="0 0 260 170" aria-hidden="true">
          <ellipse cx="130" cy="150" rx="70" ry="8" fill="#6d7f90" opacity=".25"/>
          <rect x="48" y="118" width="70" height="8" rx="1" fill="#cbb79a" stroke="#5c5348" stroke-width="1.2"/>
          <rect x="52" y="108" width="36" height="14" rx="2" fill="#efe6cf" stroke="#5c5348" stroke-width="1.2"/>
          <path d="M92 112h28" stroke="#5c5348" stroke-width="1.5"/>
          <rect x="108" y="78" width="46" height="54" rx="6" fill="#b56a58" stroke="#5c5348" stroke-width="1.4"/>
          <path d="M122 78c2-28 16-40 18-54" stroke="#8a6232" stroke-width="3" fill="none"/>
          <path d="M132 78c0-30 8-46 6-58" stroke="#c4a574" stroke-width="3" fill="none"/>
          <path d="M142 78c4-22 18-38 22-48" stroke="#6a5340" stroke-width="2.6" fill="none"/>
          <circle cx="188" cy="128" r="10" fill="none" stroke="#5c5348" stroke-width="1.4"/>
          <circle cx="208" cy="128" r="10" fill="none" stroke="#5c5348" stroke-width="1.4"/>
        </svg>
        <p class="open-hint">Ouvrir le cahier</p>
      </div>
      <div class="spread">
        <aside class="nav">
          <div class="nav-top">
            <button type="button" id="btnCover">Couverture</button>
            <button type="button" id="btnHome">Accueil</button>
          </div>
          <h2>Sommaire</h2>
          <div class="toc" id="toc"></div>
        </aside>
        <section class="sheet">
          <div class="corners">
            <div class="hit-prev" id="hitPrev" title="Page précédente"></div>
            <div class="hit-next" id="hitNext" title="Page suivante"></div>
          </div>
          <div class="sheet-body" id="body"></div>
          <footer class="sheet-foot">
            <div class="sheet-nav">
              <button type="button" id="btnPrev">← Page précédente</button>
              <button type="button" id="btnNext">Page suivante →</button>
            </div>
            <div class="mesh" id="mesh"></div>
          </footer>
        </section>
      </div>
    </div>
  </div>
  <script>
    const ORDER = ["Recettes", "Gestes", "Terroir", "Cahier"];
    const grouped = ORDER.map((cat) => ({ cat, items: POSTS.filter((p) => p.cat === cat) }));
    const sequence = [{ id: "home" }, ...POSTS.map((p) => ({ id: p.slug, post: p }))];
    let i = 0;
    const book = document.getElementById("book");
    const toc = document.getElementById("toc");
    const body = document.getElementById("body");
    const mesh = document.getElementById("mesh");

    function tocHtml() {
      let h = `<p class="chap">Par où commencer</p><button type="button" data-id="home">Que mettre à table</button>`;
      grouped.forEach(({ cat, items }) => {
        h += `<p class="chap">${cat}</p>`;
        items.forEach((p) => {
          h += `<button type="button" data-id="${p.slug}">${p.title}</button>`;
        });
      });
      toc.innerHTML = h;
    }

    function homeHtml() {
      return `
        <p class="kicker">Accueil</p>
        <p class="url"><a href="https://lacuisinedantan.fr/que-mettre-a-table/">lacuisinedantan.fr/que-mettre-a-table/</a></p>
        <h1>Que mettre à table</h1>
        <p class="lede">Indiquez l’envie et ce que vous avez. L’orientation pointe vers des articles déjà en ligne. Ce n’est pas une recette nouvelle.</p>
        <article>
          <p>Un rôti, un dessert, un geste de cuisson ou un produit du placard : partez d’un besoin concret, puis lisez les articles déjà publiés.</p>
          <p>Le sommaire de gauche liste les ${POSTS.length} pages du cahier, dans leurs chapitres : Recettes, Gestes, Terroir.</p>
        </article>`;
    }

    function postHtml(p) {
      const img = p.img ? `<img class="photo" alt="" src="${p.img}" />` : "";
      const paras = (p.paras || []).map((t) => `<p>${t}</p>`).join("");
      return `
        <p class="kicker">${p.cat}</p>
        <p class="url"><a href="https://lacuisinedantan.fr${p.path}">lacuisinedantan.fr${p.path}</a></p>
        <h1>${p.title}</h1>
        ${img}
        <article>${paras}</article>
        <p class="lede">Texte tel que publié. La page live : <a href="https://lacuisinedantan.fr${p.path}">${p.path}</a></p>`;
    }

    function paint() {
      const cur = sequence[i];
      document.querySelectorAll(".toc button").forEach((b) => {
        b.classList.toggle("is-on", b.dataset.id === cur.id);
      });
      const on = document.querySelector(".toc button.is-on");
      if (on) on.scrollIntoView({ block: "nearest" });
      if (cur.id === "home") body.innerHTML = homeHtml();
      else body.innerHTML = postHtml(cur.post);
      body.scrollTop = 0;
      const prev = sequence[i - 1];
      const next = sequence[i + 1];
      document.getElementById("btnPrev").disabled = !prev;
      document.getElementById("btnNext").disabled = !next;
      const cat = cur.post ? cur.post.cat : null;
      const same = cat ? POSTS.filter((p) => p.cat === cat && p.slug !== cur.id).slice(0, 3) : POSTS.slice(0, 3);
      mesh.innerHTML = `
        <span>Dans le cahier</span>
        <button type="button" data-go="home">Accueil</button>
        <a href="https://lacuisinedantan.fr/recettes-traditionnelles/">Recettes</a>
        <a href="https://lacuisinedantan.fr/techniques-et-savoir-faire/">Gestes</a>
        <a href="https://lacuisinedantan.fr/produits-et-terroir/">Terroir</a>
        <a href="https://lacuisinedantan.fr/blog/">Cahier</a>
        ${same.map((p) => `<button type="button" data-go="${p.slug}">${p.title}</button>`).join("")}
      `;
    }

    function goId(id) {
      const n = sequence.findIndex((x) => x.id === id);
      if (n >= 0) { i = n; paint(); }
    }
    function openBook() { book.classList.remove("closed"); paint(); }
    function closeBook() { book.classList.add("closed"); }

    tocHtml();
    document.getElementById("cover").addEventListener("click", openBook);
    document.getElementById("btnCover").addEventListener("click", closeBook);
    document.getElementById("btnHome").addEventListener("click", () => goId("home"));
    document.getElementById("btnPrev").addEventListener("click", () => { if (i > 0) { i--; paint(); } });
    document.getElementById("btnNext").addEventListener("click", () => { if (i < sequence.length - 1) { i++; paint(); } });
    document.getElementById("hitPrev").addEventListener("click", () => document.getElementById("btnPrev").click());
    document.getElementById("hitNext").addEventListener("click", () => document.getElementById("btnNext").click());
    toc.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-id]");
      if (b) goId(b.dataset.id);
    });
    mesh.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-go]");
      if (b) goId(b.dataset.go);
    });
    document.addEventListener("keydown", (e) => {
      if (book.classList.contains("closed")) return;
      if (e.key === "ArrowRight") document.getElementById("btnNext").click();
      if (e.key === "ArrowLeft") document.getElementById("btnPrev").click();
      if (e.key === "Escape") closeBook();
    });
  </script>
</body>
</html>
